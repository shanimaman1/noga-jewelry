    <meta name="theme-color" content="#0A0908" />
    <!-- Per-page <title>/<meta description>/OG/canonical are rendered by the
         <Seo> component (React 19 native head hoisting). Intentionally NOT set
         statically here: a duplicate static <meta name="description"> would sit
         first in <head> and win over the per-page one. The bare fallback title
         below only shows for the pre-hydration frame / non-JS crawlers.
         NOTE: production needs SSR / pre-rendering so crawlers get the tags
         without executing JS (client-rendered product pages index poorly). -->
    <title>נוגה — NOGA Fine Jewelry</title>
  </head>
